<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SIGN VERSE · ส่งแบบป้ายเข้าแชต</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 20px 16px 40px; font-family: "Sarabun", system-ui, sans-serif; color: #0F172A; background: #F4F7FC; line-height: 1.6; }
    h1 { font-family: "Prompt", sans-serif; font-size: 1.25rem; margin: 0 0 6px; }
    .muted { color: #475569; font-size: .95rem; }
    .card { background: #fff; border-radius: 16px; padding: 16px; margin-top: 14px; box-shadow: 0 4px 14px rgba(15,23,42,.06); }
    .card h2 { font-family: "Prompt", sans-serif; font-size: 1.05rem; margin: 0; }
    .btn { display: block; width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 999px; background: #06C755; color: #fff; font-family: "Prompt", sans-serif; font-size: 1rem; text-decoration: none; text-align: center; line-height: 50px; }
    .btn:disabled { background: #94A3B8; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #EAF2FF; color: #123D88; }
    .msg.err { background: #FEF2F2; color: #DC2626; }
    .badge { display: inline-block; padding: 0 10px; border-radius: 999px; background: #F1F5F9; font-size: .8rem; }
    .badge.sent { background: #DCFCE7; color: #166534; }
  </style>
</head>
<body>
  <h1>ส่งแบบป้ายเข้าแชต SIGN VERSE</h1>
  <p class="muted">เลือกออร์เดอร์แล้วกด "ส่งแบบเข้าแชตนี้" ระบบจะส่งรายละเอียดและภาพ Artwork / Mockup ในนามคุณเข้าแชตนี้ — ไม่มีการส่งใด ๆ จนกว่าคุณจะกดปุ่ม</p>
  <p class="msg" id="status">กำลังเตรียมข้อมูล…</p>
  <div id="orders"></div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
  <script src="order.js"></script>
</body>
</html>
